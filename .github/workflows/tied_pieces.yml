name: Tied Pieces

on:
  push:
    branches:
      - tied_pieces
  workflow_dispatch:

jobs:
  Pikafish-x86-64:
    name: ${{ matrix.config.name }}-x86-64-universal
    runs-on: ${{ matrix.config.os }}
    env:
      ARCH: x86-64-universal
      COMP: clang
      EXE: Pikafish-TiedPieces-${{ matrix.config.name }}-x86-64-universal${{ matrix.config.ext }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            os: ubuntu-24.04
            shell: bash
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.config.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup msys and install required packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git

      - name: Set up LLVM
        if: runner.os == 'Linux'
        run: |
          LLVM_VERSION=22
          curl -s https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_VERSION
          sudo apt install -y libc++-$LLVM_VERSION-dev libc++abi-$LLVM_VERSION-dev libunwind-$LLVM_VERSION-dev
          echo "EXTRACXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "EXTRALDFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> $GITHUB_PATH

      - name: Compile universal build
        run: |
          make -j4 build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  Pikafish-MacOS:
    name: MacOS-universal
    runs-on: macos-latest
    env:
      COMP: clang
      EXE: Pikafish-TiedPieces-MacOS-universal
    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Compile universal build
        run: |
          make -j3 macos-lipo EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  Pikafish-Android:
    name: Android-arm64-universal
    runs-on: ubuntu-latest
    env:
      ARCH: arm64-universal
      COMP: ndk
      EXE: Pikafish-TiedPieces-Android-arm64-universal
      LDFLAGS: "-static -Wno-unused-command-line-argument"
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7

      - name: Install NDK
        run: |
          NDKV="28.2.13676358"
          ANDROID_ROOT=/usr/local/lib/android
          ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;$NDKV"
          ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
          ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV

      - name: Compile universal build
        run: |
          export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          make -j4 build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  Pikafish-TiedPieces:
    name: Pikafish-TiedPieces
    runs-on: ubuntu-slim
    needs: [Pikafish-x86-64, Pikafish-MacOS, Pikafish-Android]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: Pikafish-TiedPieces-*
          path: Artifacts

      - name: Put binaries into release root
        run: cp Artifacts/Pikafish-TiedPieces-*/* .

      - uses: actions/upload-artifact@v7
        with:
          name: Pikafish-TiedPieces
          path: |
            Pikafish-TiedPieces-*
            AUTHORS
            Copying.txt
            README.md
